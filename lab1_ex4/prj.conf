# Enable the GPIO driver to control pin PE4 (LED3)
CONFIG_GPIO=y

# Enable the UART console (messages are printed on USART1 / RS232)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Keep the SWD debug port alive while the CPU sleeps (WFI),
# so ST-LINK can connect/flash without pressing RESET
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y
